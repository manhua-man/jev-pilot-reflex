<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Take the wheel or let AI choose its own path. An interactive driving playground powered by Jev from TypeSafe AI."
    />
    <title>JevPilot — An autonomy playground</title>
    <link rel="canonical" href="https://jevpilot.standardagents.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JevPilot" />
    <meta property="og:title" content="JevPilot — An autonomy playground" />
    <meta
      property="og:description"
      content="Take the wheel or let AI choose its own path. An interactive driving playground powered by Jev from TypeSafe AI."
    />
    <meta property="og:url" content="https://jevpilot.standardagents.ai/" />
    <meta
      property="og:image"
      content="https://jevpilot.standardagents.ai/og/jevpilot-v1.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1733" />
    <meta property="og:image:height" content="907" />
    <meta
      property="og:image:alt"
      content="JevPilot: a white electric car exploring a city with blue and amber steering paths."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JevPilot — An autonomy playground" />
    <meta
      name="twitter:description"
      content="Take the wheel or let AI choose its own path. An interactive driving playground powered by Jev from TypeSafe AI."
    />
    <meta
      name="twitter:image"
      content="https://jevpilot.standardagents.ai/og/jevpilot-v1.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="JevPilot: a white electric car exploring a city with blue and amber steering paths."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/standard-agents-mark.svg"
    />
    <style>
      #scene-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #f5f6f8;
        color: #171a20;
        font:
          14px system-ui,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      #scene-loader[hidden],
      #scene-loader [hidden] {
        display: none;
      }
      #scene-loader img {
        width: 40px;
        height: 40px;
      }
      #scene-loader strong {
        font-size: 20px;
        font-weight: 600;
      }
      #scene-loader p {
        margin: 0;
        color: #737985;
      }
      .loading-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #dfe2e6;
        border-top-color: #171a20;
        border-radius: 50%;
        animation: loading-spin 0.9s linear infinite;
      }
      #loading-retry {
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        background: #171a20;
        color: white;
        cursor: pointer;
      }
      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="loading">
    <div id="scene-loader" role="status" aria-live="polite">
      <img src="/brand/standard-agents-mark.svg" alt="" />
      <strong>Getting your drive ready</strong>
      <p id="loading-message">Loading JevPilot…</p>
      <span class="loading-spinner" aria-hidden="true"></span>
      <button id="loading-retry" hidden>Try again</button>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
